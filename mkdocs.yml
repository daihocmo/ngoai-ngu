site_author: duykhanh471
site_url: https://daihocmo.github.io
repo_name: Đóng góp & Chỉnh sửa trang
repo_url: https://github.com/daihocmo/ngoai-ngu

nav:
  - 'Trang chủ': 'index.md'
  - 'Hướng dẫn (Orca)':
    - 'Giới thiệu phương pháp': 'orca/index.md'
    - 'Giai đoạn 0': 'orca/giai-doan-0.md'
    - 'Giai đoạn 1': 'orca/giai-doan-1.md'
    - 'Giai đoạn 2': 'orca/giai-doan-2.md'
    - 'Giai đoạn 3': 'orca/giai-doan-3.md'
    - 'Giai đoạn 4': 'orca/giai-doan-4.md'
  - 'Các bài viết khác':
    - 'Guide': 'guide.md'
    - 'Đọc': doc.md
    - 'Nói': noi.md
    - 'Immersion': overview.md
    - 'Sentence Mining': sentence-mining.md
    - 'SRS': srs.md
    - 'Language Domain': 'language-domain.md'
  - 'Công cụ':
    - 'Anki': 'anki.md'
    - 'Yomitan': 'yomitan.md'
    - 'Goldendict': 'goldendict.md'
    - 'Mining': 'mining.md'
    - 'Setup': setup.md
  - 'Tài nguyên học':
    - 'Tông hợp': 'resources.md'
 
theme:
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: img/logo.png
  favicon: img/logo.png
  features:
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlighting
    - search.share
  name: material

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - meta
  - admonition
  - attr_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      
plugins:
  - search
  - open-in-new-tab
  
extra:
  generator: false
  homepage: https://daihocmo.github.io/

copyright: |
  <a href="https://daihocmo.github.io">Một dự án của Khu học mở</a>